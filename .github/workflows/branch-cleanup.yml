name: 브랜치 정리

on:
  pull_request:
    types: [opened, closed]
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  auto-assign:
    name: PR 작성자 자동 지정
    if: github.event.action == 'opened'
    runs-on: ubuntu-latest

    steps:
      - name: PR 작성자 담당자 지정
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const prAuthor = context.payload.pull_request.user.login;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            try {
              await github.rest.issues.addAssignees({
                owner,
                repo,
                issue_number: prNumber,
                assignees: [prAuthor]
              });

              console.log(`PR #${prNumber}에 @${prAuthor}를 담당자로 지정했습니다.`);
            } catch (error) {
              console.log(`@${prAuthor} 담당자 지정에 실패했습니다: ${error.message}`);
            }

  cleanup-and-notify:
    name: 병합 브랜치 삭제 및 알림
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != 'main'
    runs-on: ubuntu-latest

    steps:
      - name: 병합된 브랜치 삭제 및 댓글 작성
        uses: actions/github-script@v7
        with:
          script: |
            const branchName = context.payload.pull_request.head.ref;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.payload.pull_request.number;
            const prAuthor = context.payload.pull_request.user.login;

            try {
              await github.rest.git.deleteRef({
                owner,
                repo,
                ref: `heads/${branchName}`
              });

              console.log(`'${branchName}' 브랜치를 삭제했습니다.`);

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body: `병합된 PR 브랜치 \`${branchName}\`를 자동으로 삭제했습니다. 병합: @${context.actor}, 작성: @${prAuthor}.`
              });
            } catch (error) {
              console.log(`'${branchName}' 브랜치 삭제에 실패했습니다: ${error.message}`);

              if (error.status === 422) {
                console.log("브랜치가 이미 삭제되었거나 workflow 권한으로 삭제할 수 없습니다.");
              }
            }
