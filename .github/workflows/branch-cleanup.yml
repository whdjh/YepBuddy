name: Branch Cleanup

on:
  pull_request:
    types: [opened, closed]
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  auto-assign:
    if: github.event.action == 'opened'
    runs-on: ubuntu-latest

    steps:
      - name: Auto assign PR creator
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const prAuthor = context.payload.pull_request.user.login;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            try {
              await github.rest.issues.addAssignees({
                owner,
                repo,
                issue_number: prNumber,
                assignees: [prAuthor]
              });

              console.log(`Assigned @${prAuthor} to PR #${prNumber}`);
            } catch (error) {
              console.log(`Failed to assign @${prAuthor}: ${error.message}`);
            }

  cleanup-and-notify:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Delete merged branch and notify
        uses: actions/github-script@v7
        with:
          script: |
            const branchName = context.payload.pull_request.head.ref;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.payload.pull_request.number;
            const prAuthor = context.payload.pull_request.user.login;

            try {
              await github.rest.git.deleteRef({
                owner,
                repo,
                ref: `heads/${branchName}`
              });

              console.log(`Deleted branch '${branchName}'`);

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body: `Merged PR branch \`${branchName}\` was deleted automatically. Merged by @${context.actor}, authored by @${prAuthor}.`
              });
            } catch (error) {
              console.log(`Failed to delete branch '${branchName}': ${error.message}`);

              if (error.status === 422) {
                console.log("Branch was already deleted or can't be deleted by workflow.");
              }
            }
