name: Create GitHub Release

on:
  push:
    branches:
      - main
      - release/*

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  inspect-release:
    if: github.ref_name == 'main' || startsWith(github.ref_name, 'release/')
    name: 릴리즈 커밋 확인
    runs-on: ubuntu-latest
    outputs:
      isRelease: ${{ steps.inspect.outputs.result }}

    steps:
      - uses: actions/checkout@v4

      - id: inspect
        uses: actions/github-script@v7
        with:
          result-encoding: string
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const latestCommit = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha
            });

            const commitMessage = latestCommit.data.commit.message;
            const regex = /chore: release \d+\.\d+\.\d+/;
            const isRelease = regex.test(commitMessage);

            return isRelease.toString();

  release:
    name: GitHub Release 생성
    runs-on: ubuntu-latest
    needs: inspect-release
    if: ${{ needs.inspect-release.outputs.isRelease == 'true' }}

    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: expo
          skip-github-pull-request: true
          skip-github-release: false
          target-branch: ${{ github.ref_name }}
