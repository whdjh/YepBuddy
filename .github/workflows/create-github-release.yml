name: GitHub 릴리즈 생성

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "릴리즈 PR을 생성할 브랜치"
        required: true
        default: "main"
  push:
    branches:
      - main
      - release/*

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-pr:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (
        github.event.inputs.target_branch == 'main' ||
        startsWith(github.event.inputs.target_branch, 'release/')
      )
    name: 릴리즈 PR 생성
    runs-on: ubuntu-latest
    steps:
      - name: release-please 실행
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: expo
          path: mobile
          include-component-in-tag: false
          skip-github-release: true
          target-branch: ${{ github.event.inputs.target_branch }}

      - name: 릴리즈 PR 브랜치 체크아웃
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 네이티브 빌드 번호 정규화
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        working-directory: mobile
        run: |
          node <<'NODE'
          const fs = require("node:fs")

          const appJsonPath = "app.json"
          const appConfig = JSON.parse(fs.readFileSync(appJsonPath, "utf8"))
          const version = appConfig.expo.version
          const match = /^(\d+)\.(\d+)\.(\d+)(?:[-+].*)?$/.exec(version)

          if (!match) {
            throw new Error(`Unsupported Expo version format: ${version}`)
          }

          const [, majorText, minorText, patchText] = match
          const major = Number(majorText)
          const minor = Number(minorText)
          const patch = Number(patchText)

          appConfig.expo.ios = appConfig.expo.ios || {}
          appConfig.expo.ios.buildNumber = String(patch + 1)

          appConfig.expo.android = appConfig.expo.android || {}

          const currentVersionCode = Number(appConfig.expo.android.versionCode || 0)
          let versionCodePrefix = Math.floor(currentVersionCode / 10000000)

          if (versionCodePrefix <= 0) {
            versionCodePrefix = 55
          }

          appConfig.expo.android.versionCode =
            versionCodePrefix * 10000000 + major * 10000 + minor * 100 + patch

          fs.writeFileSync(appJsonPath, `${JSON.stringify(appConfig, null, 2)}\n`)
          NODE

      - name: 네이티브 빌드 번호 변경 커밋
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        run: |
          if git diff --quiet -- mobile/app.json; then
            echo "커밋할 네이티브 빌드 번호 변경이 없습니다."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/app.json
          git commit -m "chore: normalize native build numbers"
          git push origin HEAD:${{ fromJSON(steps.release.outputs.pr).headBranchName }}

  release:
    if: github.event_name == 'push'
    name: GitHub 릴리즈 생성
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: expo
          path: mobile
          include-component-in-tag: false
          skip-github-pull-request: true
          skip-github-release: false
          target-branch: ${{ github.ref_name }}
