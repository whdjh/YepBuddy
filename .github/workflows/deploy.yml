name: 05 스토어 배포

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "배포할 플랫폼"
        type: choice
        required: true
        default: 둘다
        options:
          - ios
          - android
          - 둘다
      submit:
        description: "스토어 자동 제출 (해제 시 빌드만 실행)"
        type: boolean
        required: true
        default: true

permissions:
  contents: read

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  IOS_IPA_PATH: /private/tmp/yepbuddy.ipa

jobs:
  deploy:
    name: EAS 빌드 및 제출
    runs-on: macos-26
    timeout-minutes: 180
    if: github.actor == 'whdjh'

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: main 브랜치 확인
        if: ${{ github.ref_name != 'main' }}
        working-directory: .
        run: |
          echo "::error::스토어 배포는 main 브랜치에서만 실행할 수 있습니다. 현재 선택: ${{ github.ref_name }}"
          exit 1

      - name: main 체크아웃
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Node 설정
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Bun 설정
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: pnpm 설정
        uses: pnpm/action-setup@v4
        with:
          version: "10.0.0"

      - name: 의존성 설치
        run: bun install --frozen-lockfile

      - name: EAS 인증 확인
        run: npx --yes eas-cli@latest whoami

      - name: iOS 로컬 빌드
        if: ${{ inputs.platform == 'ios' || inputs.platform == '둘다' }}
        run: |
          npx --yes eas-cli@latest build \
            --platform ios \
            --profile production \
            --local \
            --output "$IOS_IPA_PATH" \
            --non-interactive

      - name: iOS 스토어 제출
        if: ${{ (inputs.platform == 'ios' || inputs.platform == '둘다') && inputs.submit }}
        run: |
          npx --yes eas-cli@latest submit \
            --platform ios \
            --profile production \
            --path "$IOS_IPA_PATH" \
            --non-interactive

      - name: Android 클라우드 빌드
        if: ${{ inputs.platform == 'android' || inputs.platform == '둘다' }}
        run: |
          if [ "${{ inputs.submit }}" = "true" ]; then
            npx --yes eas-cli@latest build \
              --platform android \
              --profile production \
              --non-interactive \
              --auto-submit
          else
            npx --yes eas-cli@latest build \
              --platform android \
              --profile production \
              --non-interactive
          fi

      - name: 요약
        if: always()
        working-directory: .
        run: |
          echo "### 스토어 배포 실행 결과" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- 브랜치: \`${{ github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 체크아웃: \`main\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 작업 폴더: \`mobile\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 플랫폼: \`${{ inputs.platform }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 스토어 자동 제출: \`${{ inputs.submit }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "진행 상황은 [EAS 대시보드](https://expo.dev/accounts)에서 확인하세요." >> "$GITHUB_STEP_SUMMARY"
