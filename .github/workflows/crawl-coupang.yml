name: Coupang Price Tracker

on:
  schedule:
    # 30분마다 실행
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: coupang-tracker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    defaults:
      run:
        working-directory: worker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run Coupang trackers
        run: node trackers/all.js
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COUPANG_DISCOUNT_PERCENT: ${{ secrets.COUPANG_DISCOUNT_PERCENT }}
